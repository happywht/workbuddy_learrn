name: supply-chain

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67d8d10258f8fca132e28 # v5.4.0
        with:
          python-version: '3.12'
      - name: Install the lock export tool
        run: python -m pip install --disable-pip-version-check uv==0.10.8
      - name: Audit dependencies, scan image, and generate SBOM
        run: python tools/supply_chain_scan.py --output-dir artifacts/supply-chain
      - name: Upload machine-readable reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hub-api-supply-chain
          path: artifacts/supply-chain
          if-no-files-found: warn
          retention-days: 30
