[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "workbuddy-hub-api"
version = "0.1.0"
description = "WorkBuddy Hub catalog and publication gateway"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.29,<2",
  "opentelemetry-sdk>=1.29,<2",
  "pyjwt[crypto]>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "prometheus-client>=0.21,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hub_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
