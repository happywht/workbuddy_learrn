groups:
  - name: workbuddy-hub.rules
    rules:
      - alert: WorkBuddyHubTargetDown
        expr: up{job="workbuddy-hub-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: WorkBuddy Hub metrics target is unavailable
          description: Prometheus has been unable to scrape the Hub API for two minutes.

      - alert: WorkBuddyHubElevated5xxRate
        expr: |
          (
            sum(rate(workbuddy_hub_http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(workbuddy_hub_http_requests_total[5m])), 0.001)
          ) > 0.05
          and
          sum(rate(workbuddy_hub_http_requests_total[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: WorkBuddy Hub has a sustained 5xx error rate
          description: More than 5 percent of Hub requests failed while traffic exceeded 0.1 requests per second.

      - alert: WorkBuddyHubCatalogP95Slow
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(workbuddy_hub_http_request_duration_seconds_bucket{route="/api/v1/artifacts"}[5m])
            )
          ) > 1
          and
          sum(rate(workbuddy_hub_http_request_duration_seconds_count{route="/api/v1/artifacts"}[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: WorkBuddy Hub catalog p95 latency is high
          description: Unified catalog p95 latency has exceeded one second under sustained traffic.
