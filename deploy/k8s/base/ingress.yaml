apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hub-api
  namespace: workbuddy-hub
  labels:
    app.kubernetes.io/name: workbuddy-hub-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "3"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hub-api.example.invalid
      secretName: hub-api-tls
  rules:
    - host: hub-api.example.invalid
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: hub-api
                port:
                  name: http
          - path: /health
            pathType: Exact
            backend:
              service:
                name: hub-api
                port:
                  name: http
          - path: /ready
            pathType: Exact
            backend:
              service:
                name: hub-api
                port:
                  name: http
