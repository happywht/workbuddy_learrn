apiVersion: v1
kind: ConfigMap
metadata:
  name: hub-api-config
  namespace: workbuddy-hub
  labels:
    app.kubernetes.io/name: workbuddy-hub-api
data:
  HUB_ENV: production
  HUB_AUTH_MODE: oidc
  HUB_OIDC_ISSUER_URL: https://idp.example.invalid
  HUB_OIDC_AUDIENCE: workbuddy-hub
  HUB_OIDC_GROUPS_CLAIM: groups
  HUB_OIDC_DEPARTMENT_CLAIM: departments
  HUB_OIDC_DEPARTMENT_GROUP_PREFIX: "department:"
  HUB_OIDC_JWKS_CACHE_SECONDS: "300"
  HUB_OIDC_CLOCK_SKEW_SECONDS: "30"
  HUB_REGISTRY_PATH: /app/workbuddy-hub/data/registry.json
  HUB_SEED_DEMO_CASES: "false"
  HUB_CORS_ORIGINS: '["https://hub.example.invalid"]'
  HUB_OTEL_SERVICE_NAME: workbuddy-hub-api
  HUB_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: https://otel-collector.observability.example.invalid/v1/traces
  HUB_OTEL_TRACE_SAMPLE_RATIO: "0.1"
  HUB_OTEL_EXPORT_TIMEOUT_SECONDS: "5"
  HUB_SKILLHUB_BASE_URL: https://skills.example.invalid
  HUB_SKILLHUB_PUBLISH_PATH: REPLACE_WITH_TRUSTED_PUBLICATION_PATH
  HUB_SKILLHUB_TIMEOUT_SECONDS: "10"
  HUB_SKILLHUB_HASH_MAX_BYTES: "26214400"
  HUB_AGENTTEAMS_BASE_URL: https://teams.example.invalid
  HUB_AGENTTEAMS_MATRIX_URL: https://matrix.example.invalid
  HUB_AGENTTEAMS_MATRIX_USER_ID: "@hub-api:matrix.example.invalid"
  HUB_AGENTTEAMS_MATRIX_MEDIA_SERVER_ALLOWLIST: matrix.example.invalid
  HUB_AGENTTEAMS_MATRIX_MEDIA_MAX_BYTES: "26214400"
  HUB_AGENTTEAMS_TIMEOUT_SECONDS: "10"
