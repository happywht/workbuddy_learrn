apiVersion: v1
kind: Service
metadata:
  name: hub-api
  namespace: workbuddy-hub
  labels:
    app.kubernetes.io/name: workbuddy-hub-api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8000"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: workbuddy-hub-api
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
