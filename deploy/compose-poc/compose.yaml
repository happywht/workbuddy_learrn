name: workbuddy-hub-poc

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workbuddy_hub}
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      # This fallback is only for the local PoC. start-local.ps1 replaces it with a random ignored value.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workbuddy-local-only}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - hub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  hub-api:
    build:
      context: ../..
      dockerfile: services/hub-api/Dockerfile
    environment:
      HUB_ENV: local
      HUB_AUTH_MODE: ${AUTH_MODE:-local_header}
      HUB_OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      HUB_OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      HUB_OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-groups}
      HUB_OIDC_DEPARTMENT_CLAIM: ${OIDC_DEPARTMENT_CLAIM:-departments}
      HUB_OIDC_DEPARTMENT_GROUP_PREFIX: ${OIDC_DEPARTMENT_GROUP_PREFIX:-department:}
      HUB_OIDC_JWKS_CACHE_SECONDS: ${OIDC_JWKS_CACHE_SECONDS:-300}
      HUB_OIDC_CLOCK_SKEW_SECONDS: ${OIDC_CLOCK_SKEW_SECONDS:-30}
      HUB_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hub}:${POSTGRES_PASSWORD:-workbuddy-local-only}@postgres:5432/${POSTGRES_DB:-workbuddy_hub}
      HUB_REGISTRY_PATH: /app/workbuddy-hub/data/registry.json
      HUB_SEED_DEMO_CASES: "true"
      HUB_OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-workbuddy-hub-api}
      HUB_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      HUB_OTEL_TRACE_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-0.1}
      HUB_OTEL_EXPORT_TIMEOUT_SECONDS: ${OTEL_EXPORT_TIMEOUT_SECONDS:-5}
      HUB_SKILLHUB_BASE_URL: ${SKILLHUB_BASE_URL:-}
      HUB_SKILLHUB_TOKEN: ${SKILLHUB_TOKEN:-}
      HUB_SKILLHUB_PUBLISH_PATH: ${SKILLHUB_PUBLISH_PATH:-}
      HUB_AGENTTEAMS_BASE_URL: ${AGENTTEAMS_BASE_URL:-}
      HUB_AGENTTEAMS_TOKEN: ${AGENTTEAMS_TOKEN:-}
      HUB_AGENTTEAMS_MATRIX_URL: ${AGENTTEAMS_MATRIX_URL:-}
      HUB_AGENTTEAMS_MATRIX_TOKEN: ${AGENTTEAMS_MATRIX_TOKEN:-}
      HUB_AGENTTEAMS_MATRIX_USER_ID: ${AGENTTEAMS_MATRIX_USER_ID:-}
      HUB_AGENTTEAMS_MATRIX_MEDIA_SERVER_ALLOWLIST: ${AGENTTEAMS_MATRIX_MEDIA_SERVER_ALLOWLIST:-}
      HUB_AGENTTEAMS_MATRIX_MEDIA_MAX_BYTES: ${AGENTTEAMS_MATRIX_MEDIA_MAX_BYTES:-26214400}
    ports:
      - "${HUB_PORT:-8100}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  hub-postgres:
